name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Exact toolchain (as Bramble's mobile.yml) so clippy's lint set cannot change under a commit.
  # Keep in step with rust-toolchain.toml.
  RUST_TOOLCHAIN: 1.97.1

jobs:
  # Parallel jobs: run in sequence, these took about 22 minutes, half of it mobile's suite (each
  # vault test derives its key at the full 600,000 iterations).
  rust:
    strategy:
      fail-fast: false
      matrix:
        mode: [quick lint, test-default, test-mobile, package]
    name: rust (${{ matrix.mode }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy \
            --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      # Unquoted on purpose: "quick lint" is two modes.
      - run: bash tools/check.sh $MODE
        env:
          MODE: ${{ matrix.mode }}

  deny:
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: 0.19.8
      CARGO_DENY_SHA256: 70e769ae3872e34d45132b17040859175e11401dc12dddb0303e0b8c7d088f3f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      # The org's Actions allowlist excludes EmbarkStudios/cargo-deny-action. The release binary,
      # pinned by hash as gitleaks is, saves the two minutes `cargo install` took.
      - name: Install cargo-deny
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSLo "$RUNNER_TEMP/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 "${name}/cargo-deny"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: bash tools/check.sh deny

  # Its own job, so a failing build cannot skip it. This repo holds key custody; a committed key
  # or token must fail CI.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # gitleaks-action needs a licence for organisations; the binary is pinned by hash instead.
      - name: Install gitleaks
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: bash tools/check.sh secrets

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Must equal the `wasm-bindgen` version in Cargo.lock; ubrn runs it over the module.
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: bash tools/check.sh wasm
      - run: sha256sum js/dist/generated/bramble_core.wasm js/dist/generated/bramble_core_bg.js
