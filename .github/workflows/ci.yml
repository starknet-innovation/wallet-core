name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Exact toolchain (as Bramble's mobile.yml) so clippy's lint set cannot change under a commit.
  # Keep in step with rust-toolchain.toml.
  RUST_TOOLCHAIN: 1.97.1

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --locked --no-default-features -- -D warnings
      - run: cargo test --locked --no-fail-fast
      # The org's Actions allowlist excludes EmbarkStudios/cargo-deny-action, so install the tool
      # by exact version, as Bramble installs its Rust tools.
      - run: cargo install cargo-deny --version 0.19.8 --locked
      - run: cargo deny check

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy \
            --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      # Must equal the `wasm-bindgen` version in Cargo.lock; ubrn runs it over the module.
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: npm ci
        working-directory: js
      - run: npm run build
        working-directory: js
      - run: npm run check
        working-directory: js
      - run: npm test
        working-directory: js
      - run: sha256sum js/dist/generated/wallet_core.wasm js/dist/generated/wallet_core_bg.js
