name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Exact toolchain (as Bramble's mobile.yml) so clippy's lint set cannot change under a commit.
  # Keep in step with rust-toolchain.toml.
  RUST_TOOLCHAIN: 1.97.1

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy \
            --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - run: bash tools/check.sh quick lint test package
      # The org's Actions allowlist excludes EmbarkStudios/cargo-deny-action, so install the tool
      # by exact version, as Bramble installs its Rust tools.
      - run: cargo install cargo-deny --version 0.19.8 --locked
      - run: bash tools/check.sh deny

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Must equal the `wasm-bindgen` version in Cargo.lock; ubrn runs it over the module.
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: bash tools/check.sh wasm
      - run: sha256sum js/dist/generated/bramble_core.wasm js/dist/generated/bramble_core_bg.js
