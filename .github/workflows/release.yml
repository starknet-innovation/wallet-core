name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # attach the digests to the GitHub release
  id-token: write # npm trusted publishing (OIDC); no stored token

env:
  RUST_TOOLCHAIN: 1.97.1

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # As publish-crates.yml: a tag off main makes no release anywhere.
      - name: Release commit must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::release tag must point to a commit reachable from main"; exit 1; }
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag must equal the package and both crate versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./js/package.json').version")"
          crate="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "bramble-core") | .version')"
          core="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "starknet-wallet-core") | .version')"
          test "$tag" = "$pkg" && test "$tag" = "$crate" && test "$tag" = "$core"
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: bash tools/check.sh wasm
      - run: sha256sum js/dist/generated/bramble_core.wasm js/dist/generated/bramble_core_bg.js > SHA256SUMS
      # js/package.json stays `private` until Phase 3.1; until then a tag is a GitHub release only.
      - id: npm
        run: echo "private=$(node -p "require('./js/package.json').private === true")" >> "$GITHUB_OUTPUT"
      - if: steps.npm.outputs.private != 'true'
        run: npm publish --provenance --access public
        working-directory: js
      - run: gh release create "$GITHUB_REF_NAME" SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
