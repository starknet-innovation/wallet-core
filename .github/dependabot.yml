version: 2
# Security updates only. `open-pull-requests-limit: 0` turns off routine version bumps while
# leaving security-advisory PRs on (they ignore this limit). We bump a dependency only when we
# need it or an advisory forces it; every new version is new code we have to trust.
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      # Krusty owns wallet crypto and is bumped deliberately, with Bramble, never by a bot.
      - dependency-name: "krusty-kms*"
      # Follows Krusty; bumping it alone splits `Felt` into two types.
      - dependency-name: "starknet-types-core"
      # Moves in lockstep with uniffi-bindgen-react-native and @ubjs/*; bump by hand together.
      - dependency-name: "uniffi*"

  - package-ecosystem: "npm"
    directory: "/js"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "uniffi-bindgen-react-native"
      - dependency-name: "@ubjs/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
