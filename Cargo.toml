[workspace]
members = ["crates/wallet-core", "crates/bramble-core"]
resolver = "2"

# Shared by both crates. They release together: one tag, one version, published to crates.io in
# dependency order by .github/workflows/publish-crates.yml.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/starknet-innovation/wallet-core"
homepage = "https://github.com/starknet-innovation/wallet-core"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# PBKDF2 at the extension's 600k iterations is unusably slow unoptimised; the vault tests run the
# real KDF, so dependencies are optimised even in debug.
[profile.dev.package."*"]
opt-level = 3
