[workspace]
members = ["crates/wallet-core", "crates/bramble-core"]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# PBKDF2 at the extension's 600k iterations is unusably slow unoptimised; the vault tests run the
# real KDF, so dependencies are optimised even in debug.
[profile.dev.package."*"]
opt-level = 3
