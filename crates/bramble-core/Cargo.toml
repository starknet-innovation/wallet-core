[package]
name = "bramble-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Bramble wallet core: wallet-core plus Bramble's policy, behind one UniFFI surface for the browser extension (WASM), iOS and Android"
keywords = ["starknet", "wallet", "uniffi", "wasm", "bramble"]
categories = ["cryptography::cryptocurrencies"]

[lib]
# staticlib: linked into the iOS app through an XCFramework.
# cdylib:    loaded by Android from jniLibs, read by uniffi-bindgen, and the wasm32 module.
# lib:       integration tests and the bindgen binary.
crate-type = ["lib", "cdylib", "staticlib"]
name = "bramble_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = ["raw-keys"]
# Swift/Kotlin binding generator (`cargo run --features bindgen --bin uniffi-bindgen`).
bindgen = ["uniffi/cli"]
# Exports the functions that take or return a raw Stark private key. The extension's vault
# (schema v12) stores derived keys and hands them back for signing, so its build needs them;
# mobile keeps keys inside the core and builds with `--no-default-features`. Removed in Phase 3.2
# (docs/PLAN.md).
raw-keys = []
# The mobile wallet's surface (`WalletCore`, its vault schema and stores, the portfolio, history,
# privacy, send and coordination exports, biometric and backup glue), ported from Bramble's
# `mobile/core` (docs/PLAN.md, 2.7). iOS and Android build `--no-default-features --features mobile`;
# the extension's wasm32 build leaves it off.
mobile = ["dep:starknet-types-core", "dep:bip39", "dep:zeroize"]
# Integration-test hooks (`bramble_core::testing`: raw vault open/seal). Never enabled for the
# shipped libraries; the mobile tests require it.
testing = ["mobile"]

[dependencies]
starknet-wallet-core = { version = "=0.2.2", path = "../wallet-core" }
# Bindings for Swift, Kotlin and (through uniffi-bindgen-react-native's wasm2 flavour) TypeScript.
uniffi = { version = "=0.31.2" }
thiserror = { version = "=2.0.21" }
# Bramble's catalogs (`generated/*.json`); the versions wallet-core pins.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }
# Felt types at the version Krusty uses (`avatar.rs`'s `NonZeroFelt`), so the lockfile holds one.
starknet-types-core = { version = "=0.2.4", features = ["hash"], optional = true }
# BIP-39 English word list for the recovery-phrase word assist (the version Krusty depends on).
bip39 = { version = "=3.0.0", default-features = false, features = ["std"], optional = true }
# The mobile wallet holds phrases and passphrases in `Zeroizing`; wallet-core's pin.
zeroize = { version = "=1.9.1", features = ["derive"], optional = true }

[dev-dependencies]
# Golden-fixture hashes (tests/fixtures.rs); the same version wallet-core uses for vault crypto.
sha2 = { version = "=0.11.1" }
# The mobile tests (tests/wallet_migration.rs seals a vault as the first mobile core did, by
# hand); wallet-core's pins, so the lockfile holds one copy.
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
base64 = { version = "=0.22.1" }
sha3 = { version = "=0.12.0" }
tempfile = { version = "=3.27.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The wasm2 player's allocator and panic hook; linked by the `extern crate` line in lib.rs.
uniffi-runtime-wasm = { version = "=0.31.0-6" }
# wasm32 has no threads, so UniFFI must not demand Send + Sync on exported objects.
uniffi_core = { version = "=0.31.2", features = ["wasm-unstable-single-threaded"] }
# Pinned so `wasm-bindgen-cli` (which ubrn runs over the module) has one deliberate version to
# match. It arrives through getrandom's wasm backend in wallet-core.
wasm-bindgen = { version = "=0.2.130" }
