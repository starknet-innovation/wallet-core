[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # basic-toml is unmaintained (no vulnerability). It reaches us only through uniffi_bindgen
    # (`bindgen` feature: host-side Swift/Kotlin generation), never a shipped library.
    # Revisit on the next UniFFI bump.
    { id = "RUSTSEC-2026-0374", reason = "unmaintained, build-host tooling only (uniffi_bindgen)" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MPL-2.0", "Unicode-3.0", "Zlib", "CC0-1.0", "0BSD"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
